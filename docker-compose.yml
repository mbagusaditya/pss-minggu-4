services:
    app:
        container_name: pss_app_4
        image: pss_app:4
        build: .
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - .:/app
        depends_on:
            - db
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
